# Render.com deployment config (Docker-based Web Service)
# Deploy: push this repo to GitHub -> Render Dashboard -> New -> Blueprint
# -> select repo -> Render reads this file automatically.
services:
  - type: web
    name: ai-job-market-predictor
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /_stcore/health
    envVars:
      - key: PORT
        value: 8501
